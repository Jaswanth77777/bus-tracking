const CAMPUS_LAT=8.2436,CAMPUS_LON=77.6058;
const FACILITIES=[['Main Gate',-2,0],['Administrative Block',-12,-8],['Library',2,-6],['Student Activity Centre',-7,10],['Hostel',12,5],['Laboratories',-18,9],['Sports Ground',18,14],['Transport Area',-18,-13],['Medical Centre',9,-11],['Pharmacy',13,-9],['Cafeteria',4,10]];
function initMap(){
  const host=$('#liveMap'); if(!host)return;
  if(window.L){
    mapState.map=L.map(host,{zoomControl:true,preferCanvas:true,scrollWheelZoom:true}).setView([CAMPUS_LAT,CAMPUS_LON],15);
    // Use OpenStreetMap as the primary street basemap. It does not require a CARTO API key.
    const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      maxNativeZoom:19,
      attribution:'© OpenStreetMap contributors',
      crossOrigin:true
    });
    osm.addTo(mapState.map);
    const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}); 
    const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
    L.control.layers({'OpenStreetMap':osm,'Detailed street map':street,'Satellite view':satellite},null,{collapsed:true,position:'topright'}).addTo(mapState.map);
    L.control.scale({metric:true,imperial:false,position:'bottomleft'}).addTo(mapState.map);
    let tileErrorShown=false;
    osm.on('tileerror',()=>{if(!tileErrorShown){tileErrorShown=true;toast('Map tiles could not load. Check your internet connection and refresh the map.')}});
    mapState.stopLayer=L.layerGroup().addTo(mapState.map); mapState.ready=true; mapState.fallback=false;
    window.addEventListener('resize',()=>setTimeout(()=>mapState.map&&mapState.map.invalidateSize(),100));
    buses.forEach(b=>ensureBusMarker(b));
    setTimeout(()=>loadRoadRoute(buses.find(x=>x.id===selected)),250);
    updateLeafletMap();
  }else{
    mapState.fallback=true; host.innerHTML='<canvas class="map-canvas"></canvas>';
    const canvas=host.querySelector('canvas'); mapState.canvas=canvas; mapState.ctx=canvas.getContext('2d');
    canvas.addEventListener('click',fallbackMapClick); canvas.addEventListener('wheel',e=>{e.preventDefault();fallbackZoom(e.deltaY<0?1:-1)},{passive:false});
    fallbackResize();
  }
}
function rawBusState(b){
  return {lat:Number(b.lat)||CAMPUS_LAT,lon:Number(b.lon)||CAMPUS_LON,progress:Number(b.progress)||0};
}
function buildOfflineRoad(b){
  const coords=fallbackRouteForBus(b);
  const stopCoords=[];
  for(let i=0;i<b.stops.length;i++){
    const t=b.stops.length===1?0:i/(b.stops.length-1);
    stopCoords.push(pointOnRoad(coords,t));
  }
  return {coords,stopCoords};
}
async function loadRoadRoute(b){
  if(!b)return;
  const offline=buildOfflineRoad(b);
  roadRoutes[b.id]=offline;
  if(mapState.map)renderSelectedRoadRoute(b);
  // Request a road-following route from OSRM using the route's ordered stop coordinates.
  try{
    const stops=offline.stopCoords;
    if(stops.length>=2){
      const coords=stops.map(p=>p[1]+','+p[0]).join(';');
      const url='https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=false';
      const response=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!response.ok)throw new Error('Road router unavailable');
      const data=await response.json();
      const geometry=data.routes&&data.routes[0]&&data.routes[0].geometry&&data.routes[0].geometry.coordinates;
      if(data.code==='Ok'&&geometry&&geometry.length>1){
        roadRoutes[b.id]={coords:geometry.map(p=>[p[1],p[0]]),stopCoords:stops,realRoad:true,distance:data.routes[0].distance,duration:data.routes[0].duration};
      }
    }
  }catch(err){console.info('Using offline route fallback for',b.number,err)}
  if(mapState.map&&Number(selected)===Number(b.id))renderSelectedRoadRoute(b);
  if(Number(selected)===Number(b.id))startSelectedBusMovement(b);
  return roadRoutes[b.id];
}
function renderSelectedRoadRoute(b){
  if(!mapState.map||!b)return;
  const rr=roadRoutes[b.id]||buildOfflineRoad(b); roadRoutes[b.id]=rr;
  if(mapState.routeLine){mapState.map.removeLayer(mapState.routeLine);mapState.routeLine=null}
  if(mapState.routeCasing){mapState.map.removeLayer(mapState.routeCasing);mapState.routeCasing=null}
  // Draw a road-following route with a white outline so it stays visible over real map tiles.
  mapState.routeCasing=L.polyline(rr.coords,{color:'#ffffff',weight:10,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(mapState.map);
  mapState.routeLine=L.polyline(rr.coords,{color:'#087fce',weight:5,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(mapState.map);
  if(mapState.stopLayer){
    mapState.stopLayer.clearLayers();
    rr.stopCoords.forEach((p,i)=>{
      const stopIcon=L.divIcon({className:'joy-stop-icon',html:'<span>'+(i+1)+'</span>',iconSize:[24,24],iconAnchor:[12,12]});
      L.marker(p,{icon:stopIcon,title:b.stops[i]||('Stop '+(i+1))}).bindTooltip((i+1)+'. '+esc(b.stops[i]||'Bus stop')).addTo(mapState.stopLayer);
    });
  }
}
function drawMap(){
  if(mapState.map){updateLeafletMap();const b=buses.find(x=>Number(x.id)===Number(selected));if(b)renderSelectedRoadRoute(b);}
  else if(mapState.canvas)drawFallbackMap();
}

function markerVisualPosition(b){
  const m=busMotion[b.id];
  if(m&&m.current)return m.current;
  return getBusLatLng(b);
}
function ensureBusMarker(b){
  if(!mapState.map||!window.L)return;
  const pos=markerVisualPosition(b),sel=b.id===selected;
  let m=mapState.markers[b.id];
  const html='<div class="bus-marker '+(sel?'selected':'')+(b.live?' live':'')+'">🚌<span class="bus-label">'+esc(b.number)+'</span></div>';
  if(!m){
    m=L.marker(pos,{icon:L.divIcon({className:'',html,iconSize:[42,42],iconAnchor:[21,21]}),title:b.number}).addTo(mapState.map);
    m.on('click',()=>{selectBus(b.id);mapFollowSelected();});
    mapState.markers[b.id]=m;
  }else{
    // Do NOT overwrite the marker position here. The movement engine owns it.
    m.__selected=sel;
    const el=m.getElement();
    if(el){const icon=el.querySelector('.bus-marker');if(icon)icon.classList.toggle('selected',sel);}
  }
}
function getBusLatLng(b){
  if(b.live)return [b.lat,b.lon];
  const rr=roadRoutes[b.id];
  if(rr&&rr.coords.length)return pointOnRoad(rr.coords,Math.max(0,Math.min(1,b.progress||0)));
  const p=b.path||[[0,0],[1,1]],q=(b.progress||0)*(p.length-1),i=Math.min(p.length-2,Math.floor(q)),f=q-i;
  return [CAMPUS_LAT+(p[i][1]+(p[i+1][1]-p[i][1])*f)*.004,CAMPUS_LON+(p[i][0]+(p[i+1][0]-p[i][0])*f)*.004];
}
function pointOnRoad(coords,t){
  if(coords.length===1)return coords[0]; let total=0,seg=[];
  for(let i=1;i<coords.length;i++){const d=Math.hypot((coords[i][0]-coords[i-1][0])*111000,(coords[i][1]-coords[i-1][1])*111000*Math.cos(CAMPUS_LAT*Math.PI/180));seg.push(d);total+=d}
  let want=t*total;
  for(let i=0;i<seg.length;i++){if(want<=seg[i]){const f=seg[i]?want/seg[i]:0;return [coords[i][0]+(coords[i+1][0]-coords[i][0])*f,coords[i][1]+(coords[i+1][1]-coords[i][1])*f]}want-=seg[i]}
  return coords[coords.length-1];
}

const busMotion={};
function fallbackRouteForBus(b){
  // Offline demo route: the project's existing route shape, expanded into
  // several points so movement is visibly continuous rather than a jump.
  const p=b.path||[[0,0],[5,3],[10,6],[16,9],[23,12]];
  const out=[];
  for(let i=0;i<p.length-1;i++){
    const [x1,y1]=p[i],[x2,y2]=p[i+1];
    for(let j=0;j<12;j++){
      const t=j/12;
      out.push([CAMPUS_LAT+(y1+(y2-y1)*t)*.004,CAMPUS_LON+(x1+(x2-x1)*t)*.004]);
    }
  }
  const q=p[p.length-1];out.push([CAMPUS_LAT+q[1]*.004,CAMPUS_LON+q[0]*.004]);
  return out;
}
function movementRoute(b){
  const rr=roadRoutes[b.id];
  return rr&&rr.coords&&rr.coords.length>1 ? rr.coords : fallbackRouteForBus(b);
}
function nearestRouteIndex(coords,pos){
  let best=0,bd=Infinity;
  coords.forEach((p,i)=>{const d=(p[0]-pos[0])**2+(p[1]-pos[1])**2;if(d<bd){bd=d;best=i}});
  return best;
}
function startSelectedBusMovement(b){
  if(!b)return;
  const coords=movementRoute(b);
  const pos=markerVisualPosition(b);
  let idx=nearestRouteIndex(coords,pos);
  if(idx>=coords.length-1)idx=0;
  busMotion[b.id]={
    coords,index:idx,from:[pos[0],pos[1]],to:coords[Math.min(idx+1,coords.length-1)],
    t:0,current:[pos[0],pos[1]],active:true
  };
  if($('#mapStatus'))$('#mapStatus').textContent='Moving '+b.number+' • selected bus';
}
function updateSelectedBusMovement(dt){
  if(paused)return;
  buses.forEach(b=>{
    if(b.live){
      const liveMarker=mapState.markers[b.id];
      if(liveMarker)liveMarker.setLatLng([b.lat,b.lon]);
      if(follow&&b.id===selected&&mapState.map)mapState.map.panTo([b.lat,b.lon],{animate:false});
      return;
    }
    let m=busMotion[b.id];
    if(!m||!m.active)startSelectedBusMovement(b);
    m=busMotion[b.id];
    // Move at a believable demo road speed instead of jumping rapidly between route points.
    const a=m.from,bp=m.to;
    const metres=Math.hypot((bp[0]-a[0])*111000,(bp[1]-a[1])*111000*Math.cos(CAMPUS_LAT*Math.PI/180));
    const demoSpeedMps=9.4; // about 34 km/h
    const segmentSeconds=Math.max(.35,metres/demoSpeedMps);
    m.t+=dt/segmentSeconds;
    while(m.t>=1){m.t-=1;m.index++;if(m.index>=m.coords.length-1)m.index=0;m.from=m.coords[m.index];m.to=m.coords[m.index+1]}
    const e=m.t*m.t*(3-2*m.t);
    m.current=[m.from[0]+(m.to[0]-m.from[0])*e,m.from[1]+(m.to[1]-m.from[1])*e];
    const marker=mapState.markers[b.id];
    if(marker)marker.setLatLng(m.current);
    if(follow&&b.id===selected&&mapState.map)mapState.map.panTo(m.current,{animate:false});
  });
  if(!mapState.map&&mapState.canvas)drawFallbackMap();
  const selectedBus=buses.find(x=>x.id===selected);
  if($('#mapStatus')&&selectedBus)$('#mapStatus').textContent=(selectedBus.live?'LIVE GPS • ':'DEMO MOVEMENT • ')+selectedBus.number;
}
function applyBusMapVisibility(){
  if(!mapState.map)return;
  buses.forEach(b=>{
    const marker=mapState.markers[b.id];
    if(!marker)return;
    const show=mapViewMode==='all'||Number(b.id)===Number(selected);
    if(show){if(!mapState.map.hasLayer(marker))marker.addTo(mapState.map)}
    else if(mapState.map.hasLayer(marker))mapState.map.removeLayer(marker);
  });
}
function updateLeafletMap(){
  if(!mapState.map)return;
  buses.forEach(ensureBusMarker);

    if(!buses.some(b=>String(b.id)===String(id))){

}

function fallbackResize(){const c=mapState.canvas,h=$('#liveMap');const d=devicePixelRatio||1;c.width=h.clientWidth*d;c.height=h.clientHeight*d;c.style.width=h.clientWidth+'px';c.style.height=h.clientHeight+'px';mapState.ctx.setTransform(d,0,0,d,0,0);drawFallbackMap()}

function adminCsv(name,rows){
 const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv=rows.map(r=>r.map(quote).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='joy-university-'+name+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function adminExport(key){
 if(!adminCache)return toast('Admin data is not loaded. Refresh the dashboard first.');
 const d=adminCache;
 const users=(d.users||[]),spec={
  students:{head:['Name','University ID','Email','Active'],rows:users.filter(x=>x.role==='student'),fields:['name','uid','email','active']},
  drivers:{head:['Name','University ID','Email','Active'],rows:d.drivers||[],fields:['name','uid','email','active']},
  admins:{head:['Name','Admin ID','Email','Active'],rows:users.filter(x=>x.role==='admin'),fields:['name','uid','email','active']},
  buses:{head:['Bus','Route','Capacity','Status','Enabled'],rows:d.fleet||[],fields:['number','route','capacity','status','enabled']},
  routes:{head:['Route code','Route name','Active'],rows:d.routes||[],fields:['code','name','active']},
  assignments:{head:['Driver','Bus','Route','Active'],rows:d.assignments||[],fields:['driver_name','bus_number','route_name','active']},
  trips:{head:['ID','Bus','Driver','Status','Started','Ended'],rows:d.trips||[],fields:['id','bus_number','driver_name','status','started_at','ended_at']},
  attendance:{head:['Student','Bus','Stop','Boarded at'],rows:d.attendance||[],fields:['user_name','bus_number','stop_name','boarded_at']},
  complaints:{head:['ID','Student','Bus','Subject','Message','Status','Created'],rows:d.complaints||[],fields:['id','user_name','bus_number','subject','message','status','created_at']},
  emergencies:{head:['ID','Bus','Message','Status','Created'],rows:d.emergencies||[],fields:['id','bus_number','message','status','created_at']},
  maintenance:{head:['Bus','Issue','Status','Created'],rows:d.maintenance||[],fields:['bus_number','issue','status','created_at']},
  stops:{head:['Route ID','Stop name','Order'],rows:d.stops||[],fields:['route_id','name','stop_order']}
 };
 const s=spec[key];if(!s)return toast('This record type cannot be exported.');
 adminCsv(key,[s.head,...s.rows.map(x=>s.fields.map(k=>x[k]))]);
}
function adminExportAll(){['students','drivers','admins','buses','routes','stops','assignments','trips','attendance','complaints','emergencies','maintenance'].forEach((k,i)=>setTimeout(()=>adminExport(k),i*350));}
async function importStudentsExcel(){
 const input=$('#studentImportFile'),file=input&&input.files[0];
 if(!file)return toast('Choose an Excel .xlsx file first');
 const data=new FormData();data.append('file',file);
 try{
  const res=await fetch('/api/admin/import-students',{method:'POST',body:data,credentials:'same-origin',headers:{'X-CSRF-Token':document.querySelector('meta[name=csrf-token]')?.content||''}});
  const j=await res.json();if(!res.ok||!j.ok)throw new Error(j.error||'Import failed');
  let msg='IMPORT COMPLETED\nCreated student accounts: '+j.created+'\nExisting accounts updated/skipped: '+j.skipped+'\nBus and seat assignments saved: '+(j.assigned||0)+'.';
  if(j.credentials&&j.credentials.length)msg+='\n\nNEW STUDENT LOGIN DETAILS (copy and share privately):\n'+j.credentials.map(x=>x.name+' | '+x.email+' | Password: '+x.password+' | Student ID: '+x.student_id).join('\n');
  if(j.assignments&&j.assignments.length)msg+='\n\nSAVED BUS ASSIGNMENTS:\n'+j.assignments.map(x=>x.name+' | '+x.email+' | Bus: '+x.bus_number+' | XL Seat: '+(x.seat_number??'Not specified')+' | Route: '+(x.route_name||'Not configured')).join('\n');
  if(j.errors&&j.errors.length)msg+='\n\nROWS NEEDING CORRECTION:\n'+j.errors.map(x=>'Row '+x.row+': '+x.error).join('\n');
  $('#studentImportResult').textContent=msg;alert(msg);toast('Excel import completed. Check the result details.');
  adminCache=null;await adminPage('students');
 }catch(e){toast(e.message);const out=$('#studentImportResult');if(out)out.textContent='Import failed: '+e.message;}
}

function updateStudentBusOptions(){
 const select=$('#assignStudentBus'),info=$('#assignStudentBusAvailability');
 if(!select||!info)return;
 const bus=adminCache?.fleet?.find(b=>Number(b.id)===Number(select.value));
 if(!bus){info.textContent='Choose a bus to see its route, stops and available seats.';return;}
 const students=adminCache?.users||[];
 const used=students.filter(x=>x.role==='student'&&Number(x.assigned_bus_id)===Number(bus.id)).length;
 const capacity=Math.max(1,Number(bus.capacity)||45),available=Math.max(0,capacity-used);
 const stops=Array.isArray(bus.stops)?bus.stops:[];
 info.textContent=bus.number+' • '+(bus.route||bus.route_name||'Route not configured')+' • '+available+' / '+capacity+' seats available • Stops: '+(stops.join(' → ')||'No stops configured')+'. Seat will be assigned automatically.';
}

  const j=await api('/api/admin/students/create-and-assign',{method:'POST',body:JSON.stringify(data)});

  if(resultPanel)resultPanel.innerHTML='<strong>STUDENT ACCOUNT CREATED SUCCESSFULLY</strong><br>Name: '+esc(data.name)+'<br>Login email: '+esc(j.email)+'<br>Temporary password: '+esc(j.password)+'<br>Student ID: '+esc(j.uid)+'<br>Bus: '+esc(j.bus_number)+'<br>Seat: '+esc(j.seat_number)+'<br>Route: '+esc(j.route_name||'Not configured')+'<br>Stops: '+esc((j.stops||[]).join(' → ')||'No stops configured')+'<br><br><a class="btn primary" href="/" target="_blank" rel="noopener">OPEN STUDENT PORTAL SIGN-IN</a><p class="small muted">The student should choose Student, then sign in with the email and temporary password above. Share the password privately.</p>';
  const directoryPanel=document.querySelector('#studentDirectoryPanel');
  if(directoryPanel)directoryPanel.scrollIntoView({behavior:'smooth',block:'start'});
  toast('Student created, bus seat assigned, and student directory refreshed.');
 }catch(e){
  const msg=e.message||'Unable to create student account.';
  if(msg.toLowerCase().includes('demo accounts are read-only')){
   const resultPanel=get('studentAssignedLoginResult');
   if(resultPanel)resultPanel.innerHTML='<strong>DEMO ACCOUNT — READ ONLY</strong><p>You cannot create student records while signed in with a demo account. Sign out, then sign in with your university operational administrator account.</p><button class="btn primary" type="button" onclick="logout()">LOG OUT AND SWITCH ACCOUNT</button>';
   toast('Demo accounts are read-only. Use your university operational administrator login.');
  }else{toast(msg)}
 }
}
async function createCoreUser(role){
 const p=role==="student"?"newStudent":"newDriver";
 const name=$("#"+p+"Name").value.trim(),email=$("#"+p+"Email").value.trim();
 let password=$("#"+p+"Pass").value;
 if(!name||!email)return toast("Enter name and university email");
 if(!password)password=makeTemporaryPassword();
 if(password.length<8)return toast("Password must contain at least 8 characters");
 try{
  const j=await api("/api/admin/users",{method:"POST",body:JSON.stringify({name,email,password,role})});
  alert("Account created successfully.\\n\\nName: "+name+"\\nLogin ID: "+email+"\\nUniversity ID: "+j.uid+"\\nTemporary password: "+password+"\\n\\nCopy this password now and share it privately with the account holder.");
  adminPage();
 }catch(e){toast(e.message)}
}
function makeTemporaryPassword(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
 const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
 return Array.from(bytes,b=>chars[b%chars.length]).join("");
}

async function saveStudentBus(studentId){
 const busId=$("#studentBus"+studentId)?.value;
 const seatText=$("#studentSeat"+studentId)?.value||"";
 if(!busId){try{await api("/api/admin/students/"+studentId+"/bus",{method:"DELETE"});toast("Student bus assignment removed");adminCache=null;adminPage("students")}catch(e){toast(e.message)}return;}
 const seatNumber=seatText===""?null:Number(seatText);
 if(seatNumber!==null&&(!Number.isInteger(seatNumber)||seatNumber<1))return toast("Enter a valid positive seat number");
 try{
  const j=await api("/api/admin/students/"+studentId+"/bus",{method:"PUT",body:JSON.stringify({bus_id:Number(busId),seat_number:seatNumber})});
  toast("Bus "+j.bus_number+" and seat "+(j.seat_number??"not specified")+" assigned successfully");
  adminCache=null;adminPage("students");
 }catch(e){toast(e.message)}
}
